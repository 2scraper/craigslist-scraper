# One real run a day against craigslist.org.
#
# tests.yml (deliberately) never touches the site — see its own header. This
# one does, because an offline suite cannot notice the site changing under it,
# and on this site it changed completely: the version of this repo from April
# 2026 targeted per-city subdomains and `/d/{slug}/{10 digits}.html` URLs,
# neither of which exists any more, and nothing in the repo would have said so.
#
# THIS CANARY NEEDS NO SECRET, which is unusual in this family and is a
# measured property of Craigslist rather than an oversight. Measured
# 2026-09-14: a datacentre address in Germany, with no proxy and no key, was
# served the full New York for-sale listing — 536,962 bytes, 296 results — and
# no challenge of any kind appeared. A GitHub runner is a datacentre address,
# so it can do exactly what that machine did.
#
# If that ever stops being true the run will exit 3 and this workflow will say
# so in as many words, rather than reporting a parser regression. A proxy can
# be added then, through the ENVIRONMENT and not a commented-out flag:
#
#     gh secret set CRAIGSLIST_PROXY --repo 2scraper/craigslist-scraper
#
# `env_config.py` already reads that variable, and an unset secret arrives as
# an empty string which the loader treats as unset — so the one line below is
# correct with and without it, and the credential never reaches a command line.

name: canary

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-playwright.txt
          python -m playwright install --with-deps chromium

      # THREE batches, not one. With a single batch the walk through the
      # virtualised list is never exercised at all — and on this site the walk
      # is the only way past the first response, so a one-batch canary would
      # be green for a run holding a third of what it asked for. That is
      # precisely how a silent-single-page bug survived in this family before.
      - name: Run
        id: run
        env:
          CRAIGSLIST_PROXY: ${{ secrets.CRAIGSLIST_PROXY }}
        run: |
          # `set +e` because GitHub runs `run:` steps under `bash -e`: a
          # non-zero exit would abort the step BEFORE the line that captures
          # it, and `continue-on-error` does not change that — it stops the
          # step failing the job, not the shell's errexit.
          set +e
          python playwright_scraper.py \
            --url "https://www.craigslist.org/search/area/newyork?cat=sss" \
            --pages 3 \
            --format json \
            --out canary \
            --dump-html canary_page.html
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Interpret the exit code
        run: |
          code="${{ steps.run.outputs.exit_code }}"
          echo "scraper exited $code"
          case "$code" in
            0) : ;;
            3) echo "::warning::Blocked (exit 3). Craigslist served this repo's"
               echo "::warning::development machine — a datacentre address — without"
               echo "::warning::a proxy on 2026-09-14, so this is a CHANGE rather than"
               echo "::warning::the expected state. Set the CRAIGSLIST_PROXY secret to a"
               echo "::warning::residential exit if it persists; the parser was not"
               echo "::warning::exercised either way, so this is access, not a regression."
               exit 1 ;;
            4) echo "::error::Zero rows (exit 4) from a URL that returned ~350 when"
               echo "::error::this was written. The site was reachable, so this IS a"
               echo "::error::parser regression."
               exit 1 ;;
            5) echo "::warning::Remote API error (exit 5). Nothing was tested."
               exit 1 ;;
            6) echo "::error::Partial run (exit 6) — see the sidecar's stop_reason."
               exit 1 ;;
            *) echo "::error::Unexpected exit $code."
               exit 1 ;;
          esac

      # Thresholds are the MEASURED figures with room underneath, not round
      # numbers. Each says what it was when it was written, so a failure here
      # is comparable against something.
      - name: Check what came back
        run: |
          python - <<'PY'
          import json, sys

          meta = json.load(open("canary.meta.json"))
          rows = json.load(open("canary.json"))
          fail = []

          # Measured 2026-09-14: 1,091 rows for --pages 3 on this URL, and 353
          # for a single batch. 500 is comfortably above one batch, so this
          # fails if the walk silently did not happen.
          if len(rows) < 500:
              fail.append("only %d rows; a --pages 3 run returned 1,091 when this "
                          "was written, and a single batch alone is ~350 -- under "
                          "500 means the walk did not happen" % len(rows))

          if meta.get("status") != "complete":
              fail.append("status is %r, not 'complete' (stop_reason: %r)"
                          % (meta.get("status"), meta.get("stop_reason")))

          walk = (meta.get("walk") or {}).get("1") or {}
          if walk.get("gaps"):
              fail.append("the walk opened %d gap(s): it outran its own harvest, "
                          "so rows went by unread" % walk["gaps"])

          priced = sum(1 for r in rows if r["price"] is not None)
          share = 100.0 * priced / len(rows) if rows else 0
          # 95%-100% across 14 captures; 90 is below every measured value.
          if share < 90:
              fail.append("only %.0f%% of rows carry a price (floor 90%%, measured "
                          "95-100%%)" % share)

          # The served batch is where structured data lives at all. Measured
          # 66%-99% where the category publishes any; this URL measured 89%.
          served = [r for r in rows if r["price_source"] in ("jsonld", "static")]
          enriched = sum(1 for r in served if r["price_source"] == "jsonld")
          if served:
              es = 100.0 * enriched / len(served)
              if es < 60:
                  fail.append("structured coverage on the served batch is %.0f%% "
                              "(floor 60%%, measured 66-99%%) -- the served list and "
                              "the JSON-LD may have stopped aligning" % es)

          # One line, and the column is worthless without it: `position`
          # restarts at 1 on every batch, so a run that fails to thread the
          # batch number through silently gives rows duplicate positions.
          pairs = {(r["page"], r["position"]) for r in rows}
          if len(pairs) != len(rows):
              fail.append("page+position is not unique across %d rows (%d distinct)"
                          % (len(rows), len(pairs)))

          # Craigslist publishes (0,0) as its placeholder outside North
          # America. A US listing reporting it means the guard has gone.
          on_null_island = sum(1 for r in rows
                               if r["latitude"] == 0.0 and r["longitude"] == 0.0)
          if on_null_island:
              fail.append("%d row(s) report coordinates of exactly (0,0), which is "
                          "the site's placeholder, not a location" % on_null_island)

          print("rows: %d | priced: %.0f%% | served batch: %d rows, %d enriched"
                % (len(rows), share, len(served), enriched))
          print("walk: %r" % (walk or "none"))
          for problem in fail:
              print("::error::%s" % problem)
          sys.exit(1 if fail else 0)
          PY

      # A SECOND run, one batch, JavaScript off. It is not redundant: the run
      # above asks for three batches, which turns JavaScript ON, and on a
      # GitHub runner the site's application had already removed the served
      # result list by the time the first snapshot was taken -- so that run
      # read the rendered grid and reported "served batch: 0 rows, 0
      # enriched". Its structured-coverage assertion is guarded on there
      # being a served batch at all, so it never fired.
      #
      # Which means the first run alone is green while never touching the
      # thing most worth watching: the served list, its JSON-LD, and the
      # order-preserving subsequence alignment between them. This run costs
      # about three seconds and covers exactly that.
      - name: Run again, one batch, for the served list
        id: served
        env:
          CRAIGSLIST_PROXY: ${{ secrets.CRAIGSLIST_PROXY }}
        run: |
          set +e
          python playwright_scraper.py \
            --url "https://www.craigslist.org/search/area/newyork?cat=sss" \
            --format json \
            --out canary_served
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Check the served batch
        run: |
          code="${{ steps.served.outputs.exit_code }}"
          if [ "$code" != "0" ]; then
            echo "::warning::The one-batch run exited $code, so the served-list"
            echo "::warning::path was not checked. The walking run above stands."
            exit 0
          fi
          python - <<'PY'
          import json, sys

          rows = json.load(open("canary_served.json"))
          fail = []

          # Measured 2026-09-14: 353 rows for this URL from one served
          # response, and 294-358 across the large-area captures.
          if len(rows) < 250:
              fail.append("only %d rows from one served response; 353 measured, "
                          "294-358 across captures" % len(rows))

          enriched = sum(1 for r in rows if r["price_source"] == "jsonld")
          share = 100.0 * enriched / len(rows) if rows else 0
          # THE check this second run exists for. The served list and the
          # page's JSON-LD are aligned as an order-preserving subsequence, and
          # the parser DROPS the enrichment wholesale when they cannot be
          # reconciled -- so a share near zero means the alignment broke,
          # which is silent in every other signal.
          if share < 60:
              fail.append("structured coverage is %.0f%% (89%% measured on this "
                          "URL, 66-99%% across captures). The served list and the "
                          "JSON-LD may have stopped aligning, which the parser "
                          "handles by dropping the enrichment -- silently, as far "
                          "as row counts are concerned" % share)

          with_geo = sum(1 for r in rows if r["latitude"] is not None)
          if with_geo == 0:
              fail.append("no row carries coordinates; 89%% did on this URL")

          currencies = {r["currency"] for r in rows if r["currency"]}
          if currencies != {"USD"}:
              fail.append("currencies are %r, not {'USD'} -- this is a US area "
                          "and the currency follows the area" % currencies)

          print("served batch: %d rows | %.0f%% structured | %d with coordinates | %r"
                % (len(rows), share, with_geo, currencies))
          for problem in fail:
              print("::error::%s" % problem)
          sys.exit(1 if fail else 0)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canary-artifacts
          path: |
            canary.json
            canary.meta.json
            canary_served.json
            canary_served.meta.json
            canary_page.html*
          if-no-files-found: warn
