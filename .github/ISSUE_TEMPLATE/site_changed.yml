name: Site changed / selectors broke
description: Craigslist changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        craigslist.org moved.

        Useful to know before filing: rows come from the served no-JS result
        list (`li.cl-static-search-result`), enriched from the JSON-LD
        `ItemList` beside it; a walking run also reads the rendered cards.
        Which one broke narrows the fix a lot.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Rows (0 rows on a result list that visibly has results)
        - A specific field is null or wrong (price, sku, image, URL, location)
        - Currency or coordinates empty out (structured-data coverage warning)
        - Price coverage dropped below 90% in the run log
        - A walking run (--pages > 1) stops early or repeats rows
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact result-list or posting URL, and the country your exit IP was in.
      placeholder: "https://www.craigslist.org/search/area/newyork?cat=sss (exit IP: DE datacentre, no proxy)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - JSON-LD as the page actually serves it:
          `python3 -c "import json,sys,re;h=open('dump.html').read();print([m[:400] for m in re.findall(r'<script type=\"application/ld\\+json\">(.*?)</script>',h,re.S)][:2])"`
        - Or open devtools and paste one entry from the `ItemList`.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
